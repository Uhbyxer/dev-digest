# Harness evals — skills, subagents and CLAUDE.md workflow behaviour (evals/).
#
# What runs, decided by evals/scripts/ci-detect.mjs from the PR's changed files:
#   .claude/skills/<name>/**   → evals/skills/<name>   (if it has *.eval.ts; otherwise "SKIP (no evals)")
#   .claude/agents/<name>.md   → evals/agents/<name>   (if it has evals) AND the workflow tier
#   any CLAUDE.md              → the workflow tier (CLAUDE.md routing, dispatch, skill activation)
#   evals/workflow/**, evals/src/** → the workflow tier
#
# Models (all through OpenRouter; no UI, set here or via repo Actions *variables*):
#   EVAL_MODEL        content tier (skills)      default deepseek/deepseek-v4-flash   (var EVAL_MODEL)
#   EVAL_JUDGE_MODEL  LLM judge                  default deepseek/deepseek-v4-flash   (var EVAL_JUDGE_MODEL)
#   EVAL_TOOL_MODEL   tool tiers (agents + workflow) default deepseek/deepseek-v4-flash (var EVAL_TOOL_MODEL)
# The tool tiers have their own knob because they assert real tool use (subagent dispatch, doc reads,
# skill activation), and some cheap models do the work inline instead of dispatching (see
# evals/README.md, "Which cheap model"). DeepSeek is the default everywhere; if the dispatch case
# goes red on it, set the repo variable EVAL_TOOL_MODEL=google/gemini-2.5-flash (the model the README
# measured as dispatching). Any of them can be overridden by a repo variable or, for a one-off manual
# run, the workflow_dispatch inputs below.
#
# Gating: only `detect` and `static` block a PR. The model-backed jobs are continue-on-error until
# they have proven stable (skill activation is non-deterministic). They need the OPENROUTER_API_KEY
# Actions secret and are skipped for PRs from forks (no secrets there) — detect + static still run.
name: evals

on:
  pull_request:
    paths:
      - 'evals/**'
      - '.claude/**'
      - '**/CLAUDE.md'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Content-tier model (skills). Empty = repo var EVAL_MODEL or deepseek/deepseek-v4-flash'
        required: false
        default: ''
      judge_model:
        description: 'Judge model. Empty = repo var EVAL_JUDGE_MODEL or deepseek/deepseek-v4-flash'
        required: false
        default: ''
      tool_model:
        description: 'Tool-tier model (agents, workflow). Empty = repo var EVAL_TOOL_MODEL or deepseek/deepseek-v4-flash'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. which suites does this change touch? (no secrets, no model) ────────────────────────────
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      run_workflow: ${{ steps.detect.outputs.run_workflow }}
      touched_skills: ${{ steps.detect.outputs.touched_skills }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # manual run: pretend everything changed so every suite runs
            CHANGED_FILES="$({ echo CLAUDE.md; for d in .claude/skills/*/; do echo "${d}SKILL.md"; done; ls .claude/agents/*.md; })"
          else
            CHANGED_FILES="$(git diff --name-only "$BASE...$HEAD")"
          fi
          export CHANGED_FILES
          node evals/scripts/ci-detect.mjs

  # ── 2. model-free gates (BLOCKING) ───────────────────────────────────────────────────────────
  static:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # CLAUDE.md "Read when" pointers must exist (an agent follows them literally)
      - run: pnpm vitest run workflow/claude-md-integrity
      # SKILL.md structure/frontmatter/links — only for skills this PR touched
      - name: Skill quality gate (touched skills only)
        if: needs.detect.outputs.touched_skills != ''
        run: pnpm eval:quality ${{ needs.detect.outputs.touched_skills }}

  # ── 3. skills with written evals — content tier, direct OpenRouter, no proxy ──────────────────
  skills:
    needs: detect
    if: >-
      needs.detect.outputs.skills != '[]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.model || vars.EVAL_MODEL || 'deepseek/deepseek-v4-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-v4-flash' }}
      EVAL_QUIET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run skills/${{ matrix.skill }}/

  # ── 4. agents with written evals — tool tier, needs the LiteLLM proxy ─────────────────────────
  agents:
    needs: detect
    if: >-
      needs.detect.outputs.agents != '[]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.tool_model || vars.EVAL_TOOL_MODEL || 'deepseek/deepseek-v4-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-v4-flash' }}
      EVAL_QUIET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm vitest run agents/${{ matrix.agent }}/
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down

  # ── 5. workflow tier — CLAUDE.md routing, subagent dispatch, skill activation ─────────────────
  workflow:
    needs: detect
    if: >-
      needs.detect.outputs.run_workflow == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODEL: ${{ inputs.tool_model || vars.EVAL_TOOL_MODEL || 'deepseek/deepseek-v4-flash' }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-v4-flash' }}
      EVAL_QUIET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f proxy/docker-compose.yml up -d
      - run: pnpm proxy:wait
      - run: pnpm eval:workflow
      - if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always()
        run: docker compose -f proxy/docker-compose.yml down
